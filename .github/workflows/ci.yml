name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.10'
            os: ubuntu-latest
            dependencies: floor
          - julia: '1.10'
            os: ubuntu-latest
            dependencies: compatible
          - julia: '1'
            os: ubuntu-latest
            dependencies: compatible
          - julia: '1'
            os: windows-latest
            dependencies: compatible
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Install package and optionally pin the dependency floor
        env:
          DEPENDENCY_PROFILE: ${{ matrix.dependencies }}
        run: >-
          julia --project=. --startup-file=no -e 'using Pkg;
          if ENV["DEPENDENCY_PROFILE"] == "floor";
          Pkg.add(PackageSpec(name="QUBOTools", version=v"0.16.2"));
          Pkg.pin("QUBOTools"); end;
          Pkg.instantiate(); Pkg.status()'
      - name: Package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(coverage="user")'
      - name: Runnable examples
        run: |
          julia --project=. --startup-file=no examples/identity.jl
          julia --project=. --startup-file=no examples/workspace.jl
          julia --project=. --startup-file=no examples/certificates.jl
          julia --project=. --startup-file=no examples/dominance.jl
          julia --project=. --startup-file=no examples/domain.jl
          julia --project=. --startup-file=no examples/composition.jl
          julia --project=. --startup-file=no examples/elimination.jl
          julia --project=. --startup-file=no examples/branch_search.jl
      - name: Process core source coverage
        if: matrix.julia == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'compatible'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - name: Validate and retain core report
        if: matrix.julia == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'compatible'
        run: |
          julia --startup-file=no .github/scripts/check_coverage.jl lcov.info
          mv lcov.info lcov-core.info
      - uses: actions/upload-artifact@v7
        if: matrix.julia == '1.10' && matrix.os == 'ubuntu-latest' && matrix.dependencies == 'compatible'
        with:
          name: source-coverage-core
          path: lcov-core.info
          if-no-files-found: error
  consumers:
    name: Direct and ToQUBO / Julia ${{ matrix.julia }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.10'
            dependencies: floor
          - julia: '1'
            dependencies: compatible
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Install optional integration environment
        env:
          DEPENDENCY_PROFILE: ${{ matrix.dependencies }}
        run: >-
          julia --project=test/integration --startup-file=no -e 'using Pkg;
          Pkg.develop(path=pwd());
          if ENV["DEPENDENCY_PROFILE"] == "floor";
          Pkg.add([PackageSpec(name="QUBOTools",version=v"0.16.2"),
          PackageSpec(name="QUBODrivers",version=v"0.6.5"),
          PackageSpec(name="ToQUBO",version=v"0.7.1")]);
          Pkg.pin(["QUBOTools","QUBODrivers","ToQUBO"]); end;
          Pkg.instantiate(); Pkg.status()'
      - name: Direct, conformance and ToQUBO tests
        run: julia --code-coverage=user --project=test/integration --startup-file=no test/integration/runtests.jl
      - name: Optional consumer example
        run: julia --project=test/integration --startup-file=no examples/consumer.jl
      - name: Process optional consumer coverage
        if: matrix.julia == '1.10'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - name: Validate and retain optional report
        if: matrix.julia == '1.10'
        run: |
          julia --startup-file=no .github/scripts/check_coverage.jl lcov.info --require-extension
          mv lcov.info lcov-consumers.info
      - uses: actions/upload-artifact@v7
        if: matrix.julia == '1.10'
        with:
          name: source-coverage-consumers
          path: lcov-consumers.info
          if-no-files-found: error
  coverage:
    name: Source coverage
    needs: [test, consumers]
    runs-on: ubuntu-latest
    # Only this uploader can request identity tokens. It consumes reports and
    # executes no contributor Julia/test code, including on fork pull requests.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: source-coverage-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7
        with:
          files: lcov-core.info,lcov-consumers.info
          disable_search: true
          fail_ci_if_error: true
          # Public fork PRs use Codecov's supported tokenless fork route.
          use_oidc: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.actor != 'dependabot[bot]' || secrets.CODECOV_TOKEN == '') }}
          token: ${{ secrets.CODECOV_TOKEN }}
